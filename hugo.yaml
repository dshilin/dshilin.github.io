# Hugo configuration file
title: Рефакторинг жизни

# baseURL: https://dshilin.github.io/

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Блог
      pageRef: /blog
      weight: 1
    # - name: Docs
    #   pageRef: /docs
    #   weight: 1
    - name: Автор
      pageRef: /about
      weight: 2
    # - name: Contact ↗
    #   url: "https://github.com/imfing"
    #   weight: 3
    - name: Поиск
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/dshilin"
      params:
        icon: github
    # - name: Twitter
    #   weight: 6
    #   url: "https://twitter.com/"
    #   params:
    
params:
  navbar:
    displayTitle: true
    displayLogo: true

  footer:
    displayCopyright: true
    displayPoweredBy: true