{{- $page := .context -}}
{{- if and $page.IsPage (or (eq $page.Section "blog") (eq $page.Params.career_track "python")) -}}
<nav class="journal-article-taxonomy-footer" aria-label="Категории и темы публикации">
  {{ partial "journal-post-taxonomies.html" $page }}
</nav>
{{- end -}}
{{- with $page.Site.GetPage "/sitemap" -}}
  {{- if not .Draft }}
<nav class="journal-sitemap-footer" aria-label="Дополнительные страницы">
  <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
</nav>
  {{- end }}
{{- end -}}
